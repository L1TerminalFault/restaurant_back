<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awaze - Owner Admin Dashboard</title>
  <link rel="icon" type="image/png" href="https://placehold.co/32x32/10b981/ffffff?text=A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            emerald: {
              950: '#061f12',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .scrollbar-thin::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #064e3b;
      border-radius: 10px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    /* Light Theme Overrides */
    .light-theme {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    .light-theme .bg-card {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }
    .light-theme .bg-sidebar {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }
    .light-theme .text-heading {
      color: #0f172a !important;
    }
    .light-theme .text-muted {
      color: #64748b !important;
    }
    .light-theme input, .light-theme select, .light-theme textarea {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Environment Config
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'awaze-menu-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "demo-key",
      authDomain: "demo.firebaseapp.com",
      projectId: "demo-project",
      storageBucket: "demo.appspot.com",
      messagingSenderId: "123456",
      appId: "1:123456:web:demo"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    window.FirebaseDB = {
      db,
      auth,
      appId,
      initialAuthToken,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      collection,
      doc,
      setDoc,
      getDoc,
      updateDoc,
      deleteDoc,
      onSnapshot
    };

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('adminApp', () => ({
        isDark: true,
        isLoggedIn: false,
        isLoggingIn: false,
        isSaving: false,
        loginPasscode: '',
        selectedRestaurantId: 'girum',
        activeTab: 'items',
        searchQuery: '',
        filterType: 'all',
        filterStatus: 'all',
        showModal: false,
        showDeleteModal: false,
        showPasswordModal: false,
        showIntegrationModal: false,
        isEditing: false,
        editingId: null,
        itemToDelete: null,
        unsubscribeListener: null,
        toasts: [],

        restaurants: {
          girum: { name: 'Girum Burger & Pizza' },
          dell: { name: 'Dell Hotel & Restaurant' }
        },

        passForm: {
          current: '',
          newPass: '',
          confirm: ''
        },

        get currentRestaurant() {
          return this.restaurants[this.selectedRestaurantId] || this.restaurants['girum'];
        },

        items: [],

        get itemsCount() {
          return this.items.length;
        },
        get activeCount() {
          return this.items.filter(i => i.available !== false).length;
        },
        get foodCount() {
          return this.items.filter(i => i.category === 'food').length;
        },
        get drinksCount() {
          return this.items.filter(i => i.category === 'drinks').length;
        },
        get spicyCount() {
          return this.items.filter(i => i.spicy).length;
        },

        formData: {
          name: '',
          amharicName: '',
          category: 'food',
          subCategory: 'Meat',
          price: 450,
          image: '',
          prepTime: '15 min',
          tag: 'Chef Choice',
          spicy: false,
          description: '',
          amharicDescription: '',
          available: true,
          rating: 4.8
        },

        initApp() {
          const savedRestId = localStorage.getItem('awaze_selected_restaurant');
          if (savedRestId && this.restaurants[savedRestId]) {
            this.selectedRestaurantId = savedRestId;
          }

          // Check if session token exists
          const sessionAuth = sessionStorage.getItem('awaze_owner_logged_in');
          if (sessionAuth === 'true') {
            this.isLoggedIn = true;
            this.setupFirebaseListener();
          }
        },

        toggleTheme() {
          this.isDark = !this.isDark;
        },

        addToast(message, type = 'success') {
          const id = Date.now();
          this.toasts.push({ id, message, type });
          setTimeout(() => this.removeToast(id), 3500);
        },

        removeToast(id) {
          this.toasts = this.toasts.filter(t => t.id !== id);
        },

        async ensureFirebaseAuth() {
          if (!window.FirebaseDB) throw new Error('Firebase SDK not loaded');
          const { auth, initialAuthToken, signInWithCustomToken, signInAnonymously } = window.FirebaseDB;
          
          if (!auth.currentUser) {
            if (initialAuthToken) {
              await signInWithCustomToken(auth, initialAuthToken);
            } else {
              await signInAnonymously(auth);
            }
          }
          return auth.currentUser;
        },

        async getRestaurantPassword(restaurantId) {
          try {
            await this.ensureFirebaseAuth();
            const { db, appId, doc, getDoc } = window.FirebaseDB;
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'restaurant_settings', restaurantId);
            const snap = await getDoc(settingsRef);
            
            if (snap.exists() && snap.data().password) {
              return snap.data().password;
            }
          } catch(e) {
            console.warn('Unable to fetch custom PIN, using initial default:', e);
          }
          return '1234'; // Default initial PIN
        },

        async loginOwner() {
          if (!this.loginPasscode) {
            this.addToast('Please enter your security PIN', 'error');
            return;
          }

          this.isLoggingIn = true;
          try {
            const correctPass = await this.getRestaurantPassword(this.selectedRestaurantId);

            if (this.loginPasscode.trim() === correctPass.trim()) {
              this.isLoggedIn = true;
              sessionStorage.setItem('awaze_owner_logged_in', 'true');
              localStorage.setItem('awaze_selected_restaurant', this.selectedRestaurantId);
              this.addToast('Authenticated successfully as ' + this.currentRestaurant.name);
              this.loginPasscode = '';
              this.setupFirebaseListener();
            } else {
              this.addToast('Incorrect Security PIN. (Default PIN is 1234)', 'error');
            }
          } catch(err) {
            console.error('Login error:', err);
            this.addToast('Authentication error: ' + err.message, 'error');
          } finally {
            this.isLoggingIn = false;
          }
        },

        async updatePassword() {
          if (!this.passForm.current || !this.passForm.newPass || !this.passForm.confirm) {
            this.addToast('Please complete all password fields', 'error');
            return;
          }

          if (this.passForm.newPass !== this.passForm.confirm) {
            this.addToast('New passwords do not match', 'error');
            return;
          }

          if (this.passForm.newPass.length < 4) {
            this.addToast('Password must be at least 4 characters long', 'error');
            return;
          }

          try {
            const currentPass = await this.getRestaurantPassword(this.selectedRestaurantId);
            if (this.passForm.current.trim() !== currentPass.trim()) {
              this.addToast('Current password is incorrect', 'error');
              return;
            }

            const { db, appId, doc, setDoc } = window.FirebaseDB;
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'restaurant_settings', this.selectedRestaurantId);
            await setDoc(settingsRef, { 
              password: this.passForm.newPass.trim(), 
              updatedAt: new Date().toISOString() 
            }, { merge: true });

            this.addToast('Security PIN updated successfully!');
            this.showPasswordModal = false;
            this.passForm = { current: '', newPass: '', confirm: '' };
          } catch(e) {
            console.error('Password update error:', e);
            this.addToast('Failed to update PIN: ' + e.message, 'error');
          }
        },

        logout() {
          if (this.unsubscribeListener) {
            this.unsubscribeListener();
            this.unsubscribeListener = null;
          }
          this.isLoggedIn = false;
          sessionStorage.removeItem('awaze_owner_logged_in');
          this.addToast('Logged out successfully');
        },

        async switchRestaurant(newId) {
          this.selectedRestaurantId = newId;
          localStorage.setItem('awaze_selected_restaurant', newId);
          if (this.isLoggedIn) {
            this.setupFirebaseListener();
            this.addToast('Switched view to ' + this.currentRestaurant.name);
          }
        },

        async setupFirebaseListener() {
          if (this.unsubscribeListener) {
            this.unsubscribeListener();
            this.unsubscribeListener = null;
          }

          try {
            await this.ensureFirebaseAuth();
            const { db, appId, collection, onSnapshot } = window.FirebaseDB;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'menu_items');
            
            this.unsubscribeListener = onSnapshot(colRef, (snapshot) => {
              const loadedItems = [];
              snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.restaurantId === this.selectedRestaurantId || (!data.restaurantId && this.selectedRestaurantId === 'girum')) {
                  loadedItems.push({ id: docSnap.id, ...data });
                }
              });

              if (loadedItems.length === 0) {
                this.seedDefaultItems();
              } else {
                this.items = loadedItems;
              }
            }, (error) => {
              console.error("Firestore listener error:", error);
              this.addToast('Failed to stream live menu data from cloud', 'error');
            });

          } catch (e) {
            console.error("Firebase connection error:", e);
            this.addToast('Database connection error', 'error');
          }
        },

        async seedDefaultItems() {
          try {
            await this.ensureFirebaseAuth();
            const { db, appId, doc, setDoc } = window.FirebaseDB;
            const defaults = [
              {
                id: this.selectedRestaurantId + '_f1',
                restaurantId: this.selectedRestaurantId,
                name: 'Special Sizzling Tibs',
                amharicName: 'ልዩ የጋለ ጥብስ',
                category: 'food',
                subCategory: 'Meat',
                price: 680,
                rating: 4.9,
                prepTime: '15-20 min',
                tag: 'Chef Choice',
                description: 'Fresh pan-fried prime beef cubes sautéed with onions, rosemary and fresh green peppers.',
                amharicDescription: 'በሽንኩርት፣ ሮዝመሪ እና ነጭ ሽንኩርት በጋለ የሸክላ ምጣድ ላይ የቀረበ።',
                image: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=80&w=600',
                spicy: true,
                available: true
              },
              {
                id: this.selectedRestaurantId + '_f2',
                restaurantId: this.selectedRestaurantId,
                name: 'Royal Beyaynetu Platter',
                amharicName: 'ሮያል የፆም በያይነቱ',
                category: 'food',
                subCategory: 'Health',
                price: 490,
                rating: 4.8,
                prepTime: '10-15 min',
                tag: 'Popular',
                description: 'A colorful assortment of traditional vegan stews served with fresh teff injera.',
                amharicDescription: 'ከተለያዩ ጣፋጭ የፆም ወጦች ጋር የቀረበ አምራች በያይነቱ።',
                image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&q=80&w=600',
                spicy: false,
                available: true
              },
              {
                id: this.selectedRestaurantId + '_f3',
                restaurantId: this.selectedRestaurantId,
                name: 'Awaze Signature Burger',
                amharicName: 'አዋዜ ስፔሻል በርገር',
                category: 'food',
                subCategory: 'Burger',
                price: 520,
                rating: 4.9,
                prepTime: '15 min',
                tag: 'Best Seller',
                description: 'Double beef patty, melted cheddar cheese, caramelized onions and signature spice sauce.',
                amharicDescription: 'ድርብ የበርገር ሥጋ፣ ቼዳር ቺዝ እና ልዩ አዋዜ ሶስ።',
                image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&q=80&w=600',
                spicy: true,
                available: true
              },
              {
                id: this.selectedRestaurantId + '_d1',
                restaurantId: this.selectedRestaurantId,
                name: 'Fresh Avocado Mango Smoothie',
                amharicName: 'አቮካዶ ከማንጎ ስሙዚ',
                category: 'drinks',
                subCategory: 'Beverage',
                price: 180,
                rating: 4.7,
                prepTime: '5-10 min',
                tag: 'Refreshing',
                description: 'Layered fresh organic avocado, mango puree and a dash of lime juice.',
                amharicDescription: 'ከአዲስ አቮካዶ እና ማንጎ የተዘጋጀ የተፈጥሮ ጭማቂ።',
                image: 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&q=80&w=600',
                spicy: false,
                available: true
              }
            ];

            for (const item of defaults) {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'menu_items', item.id);
              await setDoc(docRef, item);
            }
          } catch(e) {
            console.error('Error seeding defaults:', e);
          }
        },

        filteredItems() {
          return this.items.filter(item => {
            if (this.filterType !== 'all' && item.category !== this.filterType) return false;
            if (this.filterStatus === 'available' && item.available === false) return false;
            if (this.filterStatus === 'unavailable' && item.available !== false) return false;

            if (this.searchQuery.trim() !== '') {
              const q = this.searchQuery.toLowerCase();
              return (item.name && item.name.toLowerCase().includes(q)) || 
                     (item.amharicName && item.amharicName.toLowerCase().includes(q)) ||
                     (item.subCategory && item.subCategory.toLowerCase().includes(q));
            }
            return true;
          });
        },

        async toggleAvailability(item) {
          const newStatus = !(item.available !== false);
          item.available = newStatus;

          try {
            await this.ensureFirebaseAuth();
            const { db, appId, doc, updateDoc } = window.FirebaseDB;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'menu_items', item.id);
            await updateDoc(docRef, { available: newStatus });
            this.addToast(`Item "${item.name}" set to ${newStatus ? 'In Stock' : 'Out of Stock'}`);
          } catch(e) {
            console.error('Availability toggle error:', e);
            this.addToast('Failed to update status on cloud', 'error');
          }
        },

        openAddModal() {
          this.isEditing = false;
          this.editingId = null;
          this.formData = {
            name: '',
            amharicName: '',
            category: 'food',
            subCategory: 'Meat',
            price: 450,
            image: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=80&w=600',
            prepTime: '15 min',
            tag: 'Chef Choice',
            spicy: false,
            description: '',
            amharicDescription: '',
            available: true,
            rating: 4.8
          };
          this.showModal = true;
        },

        openEditModal(item) {
          this.isEditing = true;
          this.editingId = item.id;
          this.formData = JSON.parse(JSON.stringify(item));
          this.showModal = true;
        },

        closeModal() {
          this.showModal = false;
        },

        async saveItem() {
          if (!this.formData.name || !this.formData.price) {
            this.addToast('Please provide both Item Name and Price', 'error');
            return;
          }

          this.isSaving = true;

          try {
            await this.ensureFirebaseAuth();
            const { db, appId, doc, setDoc } = window.FirebaseDB;
            const itemId = this.isEditing && this.editingId ? this.editingId : 'item_' + Date.now();

            const payload = {
              id: itemId,
              restaurantId: this.selectedRestaurantId,
              name: this.formData.name.trim(),
              amharicName: (this.formData.amharicName || '').trim(),
              category: this.formData.category || 'food',
              subCategory: this.formData.subCategory || 'Meat',
              price: Number(this.formData.price) || 0,
              image: this.formData.image || 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=80&w=600',
              prepTime: this.formData.prepTime || '15 min',
              tag: this.formData.tag || 'Popular',
              spicy: Boolean(this.formData.spicy),
              description: (this.formData.description || '').trim(),
              amharicDescription: (this.formData.amharicDescription || '').trim(),
              available: this.formData.available !== false,
              rating: Number(this.formData.rating) || 4.8,
              updatedAt: new Date().toISOString()
            };

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'menu_items', itemId);
            await setDoc(docRef, payload, { merge: true });

            this.addToast(this.isEditing ? 'Item updated successfully!' : 'New food saved to database!');
            this.closeModal();
          } catch(e) {
            console.error('Error saving food item:', e);
            this.addToast('Failed to save food item: ' + e.message, 'error');
          } finally {
            this.isSaving = false;
          }
        },

        promptDelete(item) {
          this.itemToDelete = item;
          this.showDeleteModal = true;
        },

        async confirmDelete() {
          if (!this.itemToDelete) return;
          
          try {
            await this.ensureFirebaseAuth();
            const { db, appId, doc, deleteDoc } = window.FirebaseDB;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'menu_items', this.itemToDelete.id);
            await deleteDoc(docRef);
            this.addToast(`Deleted "${this.itemToDelete.name}" from database`);
          } catch(e) {
            console.error('Delete error:', e);
            this.addToast('Failed to delete item', 'error');
          } finally {
            this.showDeleteModal = false;
            this.itemToDelete = null;
          }
        },

        getCategoryBreakdown() {
          const acc = {};
          this.items.forEach(i => {
            const cat = i.subCategory || 'General';
            acc[cat] = (acc[cat] || 0) + 1;
          });
          return acc;
        },

        getAveragePrice() {
          if (this.items.length === 0) return '0';
          const total = this.items.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
          return (total / this.items.length).toFixed(0);
        }
      }));
    });
  </script>

  <!-- Alpine.js CDN deferred loading -->
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen bg-[#050806] text-white font-sans antialiased selection:bg-emerald-500 selection:text-black">

  <div x-data="adminApp" :class="{ 'light-theme': !isDark }" class="min-h-screen flex flex-col transition-colors duration-300" x-init="initApp()">

    <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
      <template x-for="toast in toasts" :key="toast.id">
        <div 
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 translate-y-2 scale-95"
          x-transition:enter-end="opacity-100 translate-y-0 scale-100"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100 scale-100"
          x-transition:leave-end="opacity-0 scale-90"
          class="pointer-events-auto p-4 rounded-xl shadow-xl flex items-center justify-between border"
          :class="toast.type === 'success' ? 'bg-emerald-950 border-emerald-500 text-emerald-200' : 'bg-red-950 border-red-500 text-red-200'"
        >
          <div class="flex items-center space-x-2">
            <span x-text="toast.type === 'success' ? '✓' : '⚠️'" class="font-bold"></span>
            <span x-text="toast.message" class="text-xs font-semibold"></span>
          </div>
          <button @click="removeToast(toast.id)" class="text-xs ml-3 text-zinc-400 hover:text-white">✕</button>
        </div>
      </template>
    </div>

    <template x-if="!isLoggedIn">
      <div class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#0d1c13] via-[#050806] to-[#020403]">
        <div class="bg-[#0d1410] border border-emerald-900/60 p-8 rounded-3xl max-w-md w-full shadow-2xl relative overflow-hidden bg-card">
          <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
          
          <div class="flex flex-col items-center text-center mb-6">
            <div class="h-16 w-16 rounded-full bg-gradient-to-tr from-emerald-600 to-emerald-400 p-[3px] shadow-lg shadow-emerald-950/50 mb-4">
              <div class="w-full h-full bg-[#050806] rounded-full flex items-center justify-center">
                <span class="text-2xl">🔑</span>
              </div>
            </div>
            <h2 class="text-2xl font-black text-white uppercase tracking-tight text-heading">AWAZE PORTAL</h2>
            <p class="text-xs text-emerald-400 font-semibold mt-1">Owner Admin Login</p>
          </div>

          <form @submit.prevent="loginOwner()" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-zinc-400 uppercase mb-1">Select Restaurant</label>
              <select x-model="selectedRestaurantId" class="w-full bg-[#050806] border border-emerald-950 text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 font-semibold">
                <option value="girum">Girum Burger & Pizza</option>
                <option value="dell">Dell Hotel & Restaurant</option>
              </select>
            </div>

            <div>

                <span class="text-zinc-500 font-bold shrink-0">Sample Presets:</span>
                <button type="button" @click="formData.image = 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=80&w=600'" class="bg-emerald-950 border border-emerald-800 px-2 py-1 rounded text-emerald-400 shrink-0 cursor-pointer">Beef Tibs</button>
                <button type="button" @click="formData.image = 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&q=80&w=600'" class="bg-emerald-950 border border-emerald-800 px-2 py-1 rounded text-emerald-400 shrink-0 cursor-pointer">Burger</button>
                <button type="button" @click="formData.image = 'https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&q=80&w=600'" class="bg-emerald-950 border border-emerald-800 px-2 py-1 rounded text-emerald-400 shrink-0 cursor-pointer">Pizza</button>
                <button type="button" @click="formData.image = 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&q=80&w=600'" class="bg-emerald-950 border border-emerald-800 px-2 py-1 rounded text-emerald-400 shrink-0 cursor-pointer">Beyaynetu</button>
                <button type="button" @click="formData.image = 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&q=80&w=600'" class="bg-emerald-950 border border-emerald-800 px-2 py-1 rounded text-emerald-400 shrink-0 cursor-pointer">Juice</button>
              </div>
            </div>

            <!-- Prep Time, Tag, Spicy Toggle -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
              <div>
                <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Prep Time</label>
                <input type="text" x-model="formData.prepTime" placeholder="15-20 min" class="w-full bg-[#050806] border border-emerald-950 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
              </div>

              <div>
                <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Badge Tag</label>
                <input type="text" x-model="formData.tag" placeholder="Chef Choice" class="w-full bg-[#050806] border border-emerald-950 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
              </div>

              <div class="flex items-center space-x-2 pt-2 sm:pt-4">
                <input type="checkbox" id="spicyCheck" x-model="formData.spicy" class="w-4 h-4 accent-emerald-500 rounded cursor-pointer">
                <label for="spicyCheck" class="text-xs font-bold text-zinc-300 cursor-pointer">🔥 Mark as Spicy</label>
              </div>
            </div>

            <!-- Descriptions (EN & Amharic) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Description (English)</label>
                <textarea x-model="formData.description" rows="2" placeholder="Ingredients and details..." class="w-full bg-[#050806] border border-emerald-950 rounded-xl p-2.5 text-xs text-white focus:outline-none resize-none"></textarea>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Description (Amharic)</label>
                <textarea x-model="formData.amharicDescription" rows="2" placeholder="የምግቡ ዝርዝር መግለጫ..." class="w-full bg-[#050806] border border-emerald-950 rounded-xl p-2.5 text-xs text-white focus:outline-none resize-none"></textarea>
              </div>
            </div>

            <!-- Availability Radio -->
            <div class="flex items-center space-x-4 pt-2">
              <span class="text-xs font-bold text-zinc-400">Availability:</span>
              <label class="inline-flex items-center space-x-1 text-xs cursor-pointer">
                <input type="radio" :value="true" x-model="formData.available" class="accent-emerald-500">
                <span class="text-emerald-400 font-bold">In Stock</span>
              </label>
              <label class="inline-flex items-center space-x-1 text-xs cursor-pointer">
                <input type="radio" :value="false" x-model="formData.available" class="accent-red-500">
                <span class="text-red-400 font-bold">Out of Stock</span>
              </label>
            </div>

            <!-- Submit Button -->
            <div class="pt-4 flex items-center justify-end space-x-3 border-t border-emerald-950/80">
              <button type="button" @click="closeModal()" class="px-4 py-2.5 rounded-xl border border-zinc-700 text-xs font-bold text-zinc-300 hover:bg-zinc-800 transition">Cancel</button>
              <button type="submit" :disabled="isSaving" class="bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold text-xs px-6 py-2.5 rounded-xl transition shadow-lg shadow-emerald-950/50 flex items-center space-x-2 cursor-pointer disabled:opacity-50">
                <span x-text="isSaving ? 'Saving to Database...' : (isEditing ? 'Save Changes' : 'Save Food to Database')"></span>
              </button>
            </div>

          </form>
        </div>
      </div>
    </template>

    <template x-if="showPasswordModal">
      <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div @click.outside="showPasswordModal = false" class="bg-[#0d1410] border border-emerald-800/60 w-full max-w-md rounded-3xl p-6 shadow-2xl relative bg-card">
          
          <button @click="showPasswordModal = false" class="absolute top-5 right-5 text-zinc-400 hover:text-white text-lg cursor-pointer">✕</button>

          <div class="flex items-center space-x-3 mb-4">
            <span class="text-2xl">🔐</span>
            <div>
              <h3 class="text-lg font-black text-white text-heading">Change Access PIN</h3>
              <p class="text-xs text-zinc-400 text-muted">Update PIN for <span class="text-emerald-400 font-bold" x-text="currentRestaurant.name"></span></p>
            </div>
          </div>

          <form @submit.prevent="updatePassword()" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-zinc-400 uppercase mb-1">Current PIN / Password</label>
              <input type="password" x-model="passForm.current" placeholder="Enter current PIN" required class="w-full bg-[#050806] border border-emerald-950 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-zinc-400 uppercase mb-1">New PIN / Password</label>
              <input type="password" x-model="passForm.newPass" placeholder="Enter new passcode (min 4 chars)" required class="w-full bg-[#050806] border border-emerald-950 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-zinc-400 uppercase mb-1">Confirm New PIN</label>
              <input type="password" x-model="passForm.confirm" placeholder="Re-enter new passcode" required class="w-full bg-[#050806] border border-emerald-950 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div class="pt-2 flex justify-end space-x-3">
              <button type="button" @click="showPasswordModal = false" class="px-4 py-2.5 rounded-xl border border-zinc-700 text-xs font-bold text-zinc-300 hover:bg-zinc-800">Cancel</button>
              <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-emerald-950/50 cursor-pointer">Update Security PIN</button>
            </div>
          </form>

        </div>
      </div>
    </template>

    <template x-if="showDeleteModal">
      <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0d1410] border border-red-900/60 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center bg-card">
          <span class="text-4xl block mb-2">🗑️</span>
          <h3 class="text-lg font-black text-white text-heading mb-1">Confirm Deletion</h3>
          <p class="text-xs text-zinc-400 mb-6 text-muted">Are you sure you want to permanently delete <strong class="text-white" x-text="itemToDelete?.name"></strong> from Firestore database?</p>
          
          <div class="flex items-center justify-center space-x-3">
            <button @click="showDeleteModal = false" class="px-4 py-2.5 rounded-xl border border-zinc-700 text-xs font-bold text-zinc-300 hover:bg-zinc-800">Cancel</button>
            <button @click="confirmDelete()" class="bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-red-950/50">Yes, Delete</button>
          </div>
        </div>
      </div>
    </template>

    <template x-if="showIntegrationModal">
      <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div @click.outside="showIntegrationModal = false" class="bg-[#0d1410] border border-emerald-800/60 w-full max-w-md rounded-3xl p-6 shadow-2xl relative bg-card">
          <button @click="showIntegrationModal = false" class="absolute top-5 right-5 text-zinc-400 hover:text-white text-lg cursor-pointer">✕</button>

          <div class="flex items-center space-x-3 mb-4">
            <span class="text-2xl">📲</span>
            <div>
              <h3 class="text-lg font-black text-white text-heading">Customer Menu Integration</h3>
              <p class="text-xs text-zinc-400 text-muted">Database collection ID for menu queries</p>
            </div>
          </div>

          <div class="bg-[#050806] border border-emerald-950 p-4 rounded-xl space-y-3">
            <div>
              <span class="text-[10px] font-bold text-zinc-500 uppercase block mb-1">Firestore Data Collection Path</span>
              <code class="text-xs text-emerald-400 font-mono bg-emerald-950/50 p-2 rounded block break-all">
                /artifacts/{appId}/public/data/menu_items
              </code>
            </div>

            <div>
              <span class="text-[10px] font-bold text-zinc-500 uppercase block mb-1">Current Active Restaurant Filter ID</span>
              <code class="text-xs text-amber-400 font-mono bg-amber-950/50 p-2 rounded block" x-text="'restaurantId = \'' + selectedRestaurantId + '\''"></code>
            </div>
          </div>

          <div class="mt-4 pt-4 border-t border-emerald-950 flex justify-end">
            <button @click="showIntegrationModal = false" class="bg-emerald-600 text-black text-xs font-bold px-4 py-2 rounded-xl">Close</button>
          </div>
        </div>
      </div>
    </template>

  </div>

</body>
</html>
