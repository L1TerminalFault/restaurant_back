<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awaze - Restaurant Management Portal</title>
  
  <!-- Literata Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Literata"', 'serif'],
          },
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Literata', serif;
      background-color: #0b0f0d;
      color: #f1f5f9;
      font-size: 0.925rem;
    }
    .scrollbar-thin::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #064e3b;
      border-radius: 10px;
    }
  </style>

  <!-- Alpine.js -->
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen antialiased">

  <div x-data="restaurantApp()" class="min-h-screen flex flex-col" x-init="initApp()">

    <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
      <template x-for="toast in toasts" :key="toast.id">
        <div class="pointer-events-auto p-4 rounded-xl shadow-xl flex items-center justify-between border bg-emerald-950 border-emerald-500 text-emerald-200">
          <div class="flex items-center space-x-2">
            <span>✓</span>
            <span x-text="toast.message" class="text-sm font-bold"></span>
          </div>
          <button @click="removeToast(toast.id)" class="text-xs ml-3 text-zinc-400 hover:text-white cursor-pointer">✕</button>
        </div>
      </template>
    </div>

    <template x-if="!isLoggedIn">
      <div class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#0d1c13] via-[#050806] to-[#020403]">
        <div class="bg-[#111814] border border-emerald-900/60 p-6 md:p-8 rounded-3xl max-w-md w-full shadow-2xl relative">
          <div class="flex flex-col items-center text-center mb-6">
            <div class="h-14 w-14 rounded-full bg-emerald-600/20 border border-emerald-500 flex items-center justify-center mb-3">
              <span class="text-xl">🏨</span>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">AWAZE RESTAURANT PORTAL</h2>
            <p class="text-xs text-emerald-400 mt-1">Select your establishment to log in</p>
          </div>

          <form @submit.prevent="login()" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-zinc-300 uppercase mb-1">Select Establishment</label>
              <select x-model="loginRestId" class="w-full bg-[#0b0f0d] border border-emerald-900 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                <template x-for="(rest, key) in restaurants" :key="key">
                  <option :value="key" x-text="rest.name + ' (' + rest.amharicName + ')'"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-zinc-300 uppercase mb-1">Security PIN / Password</label>
              <input type="password" x-model="loginPin" placeholder="Enter PIN (Default: 1234)" class="w-full bg-[#0b0f0d] border border-emerald-900 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500" required />
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-sm py-3 rounded-xl transition shadow-lg shadow-emerald-950/50 cursor-pointer">
              Login to Dashboard
            </button>
          </form>
          <div class="mt-4 text-center text-xs text-zinc-400">Default PIN: <strong class="text-emerald-400">1234</strong></div>
        </div>
      </div>
    </template>

    <template x-if="isLoggedIn">
      <div class="flex flex-col lg:flex-row min-h-screen">
        
        <!-- Sidebar Navigation (Sticky on desktop so it doesn't move when scrolling) -->
        <aside class="w-full lg:w-64 bg-[#0d1410] border-b lg:border-b-0 lg:border-r border-emerald-950 p-5 flex flex-col justify-between shrink-0 lg:sticky lg:top-0 lg:h-screen">
          <div>
            <!-- Hotel Brand -->
            <div class="flex items-center space-x-3 mb-6 p-2.5 rounded-2xl bg-[#0b0f0d] border border-emerald-900/50">
              <div class="h-10 w-10 rounded-full bg-emerald-600/20 border border-emerald-500 flex items-center justify-center shrink-0">
                <span class="text-base">🏢</span>
              </div>
              <div class="overflow-hidden">
                <h1 class="font-bold text-sm text-white truncate" x-text="currentRestaurant.name"></h1>
                <span class="text-emerald-400 text-[11px] block truncate" x-text="currentRestaurant.location"></span>
              </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="space-y-1.5">
              <button @click="activeMainTab = 'dashboard'" :class="activeMainTab === 'dashboard' ? 'bg-emerald-600 text-black font-bold shadow-lg shadow-emerald-950/50' : 'text-zinc-300 hover:text-white hover:bg-emerald-950/30'" class="w-full flex items-center space-x-2.5 px-3.5 py-2.5 rounded-xl text-sm transition cursor-pointer">
                <span>📊</span>
                <span>Dashboard</span>
              </button>

              <button @click="activeMainTab = 'items'" :class="activeMainTab === 'items' ? 'bg-emerald-600 text-black font-bold shadow-lg shadow-emerald-950/50' : 'text-zinc-300 hover:text-white hover:bg-emerald-950/30'" class="w-full flex items-center space-x-2.5 px-3.5 py-2.5 rounded-xl text-sm transition cursor-pointer">
                <span>🍽️</span>
                <span>Items</span>
              </button>

              <button @click="activeMainTab = 'notifications'" :class="activeMainTab === 'notifications' ? 'bg-emerald-600 text-black font-bold shadow-lg shadow-emerald-950/50' : 'text-zinc-300 hover:text-white hover:bg-emerald-950/30'" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm transition cursor-pointer">
                <div class="flex items-center space-x-2.5">
                  <span>💬</span>
                  <span>Notifications</span>
                </div>
                <span class="bg-emerald-500 text-black text-[10px] font-bold px-1.5 py-0.5 rounded-full" x-text="notifications.length"></span>
              </button>

              <button @click="activeMainTab = 'identity'" :class="activeMainTab === 'identity' ? 'bg-emerald-600 text-black font-bold shadow-lg shadow-emerald-950/50' : 'text-zinc-300 hover:text-white hover:bg-emerald-950/30'" class="w-full flex items-center space-x-2.5 px-3.5 py-2.5 rounded-xl text-sm transition cursor-pointer">
                <span>⚙️</span>
                <span>Identity & Profile</span>
              </button>
            </nav>
          </div>

          <div class="pt-4 mt-4 border-t border-emerald-950 flex items-center justify-between">
            <span class="text-[11px] text-zinc-400">Locked session</span>
            <button @click="logout()" class="text-xs font-bold text-red-400 hover:text-red-300 px-2.5 py-1.5 rounded-lg border border-red-950 bg-red-950/20 cursor-pointer">
              Logout
            </button>
          </div>
        </aside>

        <main class="flex-grow p-5 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
          
          <template x-if="activeMainTab === 'dashboard'">
            <div class="space-y-6">
              
              <!-- Header & Banner Insight Ticker -->
              <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <h2 class="text-2xl font-bold text-white">Management Dashboard</h2>
                  <p class="text-zinc-400 text-xs">Comprehensive real-time analytics and QR insights for <span class="text-emerald-400" x-text="currentRestaurant.name"></span>.</p>
                </div>
                <div class="bg-emerald-950/60 border border-emerald-800/80 p-3 rounded-2xl max-w-lg">
                  <div class="text-[11px] font-bold text-emerald-400 uppercase tracking-wide mb-0.5">💡 Key Operational Highlight</div>
                  <p class="text-xs text-zinc-200" x-text="dashboardInsights.bannerHighlight"></p>
                </div>
              </div>

              <!-- Top Metric Cards -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-[#111814] border border-emerald-950 p-5 rounded-2xl shadow-lg">
                  <div class="flex items-center justify-between text-zinc-400 text-xs font-bold uppercase mb-2">
                    <span>Total QR Scans</span>
                    <span class="text-emerald-400 text-lg">📱</span>
                  </div>
                  <div class="text-3xl font-bold text-white" x-text="dashboardMetrics.totalScans">0</div>
                  <span class="text-[11px] text-emerald-400 mt-1 block">↑ 18% from last month</span>
                </div>

                <div class="bg-[#111814] border border-emerald-950 p-5 rounded-2xl shadow-lg">
                  <div class="flex items-center justify-between text-zinc-400 text-xs font-bold uppercase mb-2">
                    <span>Menu Scans</span>
                    <span class="text-blue-400 text-lg">📋</span>
                  </div>
                  <div class="text-3xl font-bold text-white" x-text="dashboardMetrics.menuScans">0</div>
                  <span class="text-[11px] text-blue-400 mt-1 block">Unique digital menu sessions</span>
                </div>

                <div class="bg-[#111814] border border-emerald-950 p-5 rounded-2xl shadow-lg">
                  <div class="flex items-center justify-between text-zinc-400 text-xs font-bold uppercase mb-2">
                    <span>Daily / Weekly Visitors</span>
                    <span class="text-amber-400 text-lg">👥</span>
                  </div>
                  <div class="text-2xl font-bold text-amber-400">
                    <span x-text="dashboardMetrics.dailyVisitors"></span> <span class="text-xs text-zinc-400">/day</span>
                  </div>
                  <span class="text-[11px] text-zinc-400 mt-1 block"><strong class="text-white" x-text="dashboardMetrics.weeklyVisitors"></strong> unique visitors this week</span>
                </div>

                <div class="bg-[#111814] border border-emerald-950 p-5 rounded-2xl shadow-lg">
                  <div class="flex items-center justify-between text-zinc-400 text-xs font-bold uppercase mb-2">
                    <span>Avg Menu Viewing Time</span>
                    <span class="text-purple-400 text-lg">⏱️</span>
                  </div>
                  <div class="text-2xl font-bold text-purple-400" x-text="dashboardMetrics.avgViewingTime">0s</div>
                  <span class="text-[11px] text-zinc-400 mt-1 block">Optimal engagement span</span>
                </div>
              </div>

              <!-- Awaze Score Breakdown -->
              <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-6 shadow-xl">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-3">
                  <div>
                    <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                      <span>⭐ Awaze Score Breakdown</span>
                    </h3>
                    <p class="text-xs text-zinc-400">Algorithmic quality rating across 6 critical hospitality vectors.</p>
                  </div>
                  <div class="bg-emerald-600 text-black px-4 py-2 rounded-2xl font-extrabold text-xl shadow-lg">
                    Overall: <span x-text="awazeScores.overall"></span>/100
                  </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                  <div class="bg-[#0b0f0d] p-3.5 rounded-2xl border border-emerald-950 text-center">
                    <span class="text-[11px] text-zinc-400 uppercase font-bold block mb-1">Photography</span>
                    <span class="text-xl font-bold text-emerald-400" x-text="awazeScores.photography + '/100'"></span>
                  </div>
                  <div class="bg-[#0b0f0d] p-3.5 rounded-2xl border border-emerald-950 text-center">
                    <span class="text-[11px] text-zinc-400 uppercase font-bold block mb-1">Menu Quality</span>
                    <span class="text-xl font-bold text-emerald-400" x-text="awazeScores.menuQuality + '/100'"></span>
                  </div>
                  <div class="bg-[#0b0f0d] p-3.5 rounded-2xl border border-emerald-950 text-center">
                    <span class="text-[11px] text-zinc-400 uppercase font-bold block mb-1">Popularity</span>
                    <span class="text-xl font-bold text-emerald-400" x-text="awazeScores.popularity + '/100'"></span>
                  </div>
                  <div class="bg-[#0b0f0d] p-3.5 rounded-2xl border border-emerald-950 text-center">
                    <span class="text-[11px] text-zinc-400 uppercase font-bold block mb-1">Engagement</span>
                    <span class="text-xl font-bold text-emerald-400" x-text="awazeScores.customerEngagement + '/100'"></span>
                  </div>
                  <div class="bg-[#0b0f0d] p-3.5 rounded-2xl border border-emerald-950 text-center">
                    <span class="text-[11px] text-zinc-400 uppercase font-bold block mb-1">Completeness</span>
                    <span class="text-xl font-bold text-emerald-400" x-text="awazeScores.completeness + '/100'"></span>
                  </div>
                  <div class="bg-[#0b0f0d] p-3.5 rounded-2xl border border-emerald-950 text-center">
                    <span class="text-[11px] text-zinc-400 uppercase font-bold block mb-1">Freshness</span>
                    <span class="text-xl font-bold text-amber-400" x-text="awazeScores.menuFreshness + '/100'"></span>
                  </div>
                </div>
              </div>

              <!-- AI Recommendations & Monthly Report Grid -->
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <!-- AI Recommendations -->
                <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                  <div>
                    <h3 class="text-lg font-bold text-white mb-1 flex items-center space-x-2">
                      <span>🤖 AI Recommendations</span>
                    </h3>
                    <p class="text-xs text-zinc-400 mb-4">Actionable revenue insights derived from guest scanning patterns.</p>
                    
                    <div class="space-y-3">
                      <div class="p-4 bg-emerald-950/40 border border-emerald-900 rounded-2xl">
                        <p class="text-xs text-emerald-200 leading-relaxed font-medium">
                          “Your coffee menu receives 3× more attention than pastries. Consider creating a <strong class="text-white underline">Coffee + Pastry combo</strong>.”
                        </p>
                      </div>
                      <div class="p-4 bg-[#0b0f0d] border border-emerald-950 rounded-2xl">
                        <p class="text-xs text-zinc-300 leading-relaxed">
                          “Breakfast traffic is surging by 22% week-over-week. Ensure your morning staff is fully scheduled by 7:30 AM.”
                        </p>
                      </div>
                    </div>
                  </div>
                  <div class="mt-4 pt-3 border-t border-emerald-950 text-[11px] text-emerald-400">
                    Updated 2 hours ago by Awaze AI Engine
                  </div>
                </div>

                <!-- Monthly Report -->
                <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                  <div>
                    <h3 class="text-lg font-bold text-white mb-1 flex items-center space-x-2">
                      <span>📈 Monthly Performance Report</span>
                    </h3>
                    <p class="text-xs text-zinc-400 mb-4">Summary of key business indicators for the current cycle.</p>
                    
                    <div class="grid grid-cols-2 gap-3 text-xs">
                      <div class="p-3 bg-[#0b0f0d] rounded-xl border border-emerald-950">
                        <span class="text-zinc-400 block">Visits:</span>
                        <strong class="text-emerald-400 text-sm">↑ 18% growth</strong>
                      </div>
                      <div class="p-3 bg-[#0b0f0d] rounded-xl border border-emerald-950">
                        <span class="text-zinc-400 block">Top Popular Dish:</span>
                        <strong class="text-white text-sm" x-text="mostViewedDish.name"></strong>
                      </div>
                      <div class="p-3 bg-[#0b0f0d] rounded-xl border border-emerald-950">
                        <span class="text-zinc-400 block">Best / Worst Day:</span>
                        <strong class="text-white text-xs">Friday / Tuesday</strong>
                      </div>
                      <div class="p-3 bg-[#0b0f0d] rounded-xl border border-emerald-950">
                        <span class="text-zinc-400 block">Hidden Opportunity:</span>
                        <strong class="text-amber-400 text-xs">Dessert cross-sell</strong>
                      </div>
                    </div>
                  </div>
                  <div class="mt-4 pt-3 border-t border-emerald-950 text-[11px] text-zinc-400">
                    Overall Restaurant Score: <strong class="text-emerald-400">91/100 (Top Tier)</strong>
                  </div>
                </div>

              </div>

              <!-- Detailed Analytics Grid -->
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- Most Viewed vs Least Viewed Foods & Why -->
                <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-5 shadow-xl">
                  <h3 class="text-base font-bold text-white mb-3">🔥 Food View Analysis</h3>
                  <div class="space-y-3 text-xs">
                    <div class="p-3.5 bg-emerald-950/30 border border-emerald-900/60 rounded-2xl">
                      <span class="text-[10px] font-bold text-emerald-400 uppercase block mb-1">Most Viewed: Special Sizzling Tibs</span>
                      <p class="text-zinc-300 leading-relaxed">High viewer interest due to vibrant food photography and placement at the very top of the QR menu.</p>
                    </div>
                    <div class="p-3.5 bg-red-950/20 border border-red-950 rounded-2xl">
                      <span class="text-[10px] font-bold text-red-400 uppercase block mb-1">Least Viewed: Vegetable Soup</span>
                      <p class="text-zinc-300 leading-relaxed">Low view counts because it's buried under the beverages section and lacks an appetizing thumbnail image.</p>
                    </div>
                  </div>
                </div>

                <!-- Popular Categories with Percentages -->
                <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-5 shadow-xl">
                  <h3 class="text-base font-bold text-white mb-3">📊 Category View Percentages</h3>
                  <div class="space-y-3">
                    <template x-for="cat in categoryPercentages" :key="cat.name">
                      <div>
                        <div class="flex justify-between text-xs font-bold mb-1">
                          <span class="text-white" x-text="cat.name"></span>
                          <span class="text-emerald-400" x-text="cat.percentage + '%'"></span>
                        </div>
                        <div class="w-full bg-[#0b0f0d] h-2.5 rounded-full overflow-hidden border border-emerald-950">
                          <div class="bg-emerald-600 h-full rounded-full transition-all duration-500" :style="'width: ' + cat.percentage + '%'"></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Foods Customers Compare Back-to-Back -->
                <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-5 shadow-xl">
                  <h3 class="text-base font-bold text-white mb-3">🔄 Customer Comparison Pairs</h3>
                  <p class="text-zinc-400 text-xs mb-3">Dishes viewed consecutively in single customer sessions.</p>
                  <div class="space-y-2.5 text-xs">
                    <div class="p-3 bg-[#0b0f0d] rounded-xl border border-emerald-950 flex justify-between items-center">
                      <span class="text-white font-medium">Sizzling Tibs vs. Doro Wot</span>
                      <span class="text-emerald-400 font-bold">42% match</span>
                    </div>
                    <div class="p-3 bg-[#0b0f0d] rounded-xl border border-emerald-950 flex justify-between items-center">
                      <span class="text-white font-medium">Avocado Smoothie vs. Honey Tej</span>
                      <span class="text-emerald-400 font-bold">31% match</span>
                    </div>
                    <div class="p-3 bg-[#0b0f0d] rounded-xl border border-emerald-950 flex justify-between items-center">
                      <span class="text-white font-medium">Veggie Platter vs. Special Tibs</span>
                      <span class="text-emerald-400 font-bold">25% match</span>
                    </div>
                  </div>
                </div>

              </div>

              <!-- Peak Scan Hours & Good View Changes After Arrangement -->
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <!-- Peak Scan Hours -->
                <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-5 shadow-xl">
                  <h3 class="text-base font-bold text-white mb-3">⏰ Peak Scan Hours</h3>
                  <div class="grid grid-cols-4 gap-2.5 text-center text-xs">
                    <div class="p-3 bg-[#0b0f0d] rounded-2xl border border-emerald-950">
                      <span class="text-zinc-400 block mb-1">12:00 - 14:00</span>
                      <strong class="text-emerald-400 text-sm">Lunch Rush</strong>
                    </div>
                    <div class="p-3 bg-[#0b0f0d] rounded-2xl border border-emerald-950">
                      <span class="text-zinc-400 block mb-1">16:00 - 18:00</span>
                      <strong class="text-blue-400 text-sm">Coffee Peak</strong>
                    </div>
                    <div class="p-3 bg-[#0b0f0d] rounded-2xl border border-emerald-950">
                      <span class="text-zinc-400 block mb-1">19:00 - 22:00</span>
                      <strong class="text-amber-400 text-sm">Dinner Rush</strong>
                    </div>
                    <div class="p-3 bg-[#0b0f0d] rounded-2xl border border-emerald-950">
                      <span class="text-zinc-400 block mb-1">Other Hours</span>
                      <strong class="text-zinc-400 text-sm">Standard</strong>
                    </div>
                  </div>
                </div>

                <!-- Good View Changes After Image Arrangement -->
                <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-5 shadow-xl">
                  <h3 class="text-base font-bold text-white mb-3">📈 Arrangement Impact Analysis</h3>
                  <div class="p-3.5 bg-emerald-950/30 border border-emerald-900 rounded-2xl text-xs space-y-2">
                    <p class="text-emerald-200 font-semibold">
                      ✓ Moving Sizzling Tibs to the top banner increased order clicks by <strong class="text-white">34%</strong>.
                    </p>
                    <p class="text-zinc-300">
                      Refining high-res photography descriptions and placing traditional honey drinks first yielded a 28% increase in beverage basket sizes.
                    </p>
                  </div>
                </div>

              </div>

              <!-- Competitor Insights (Without Identities) -->
              <div class="bg-[#111814] border border-emerald-950 rounded-3xl p-6 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-1">🏢 Competitor Benchmarking Insights (Anonymous)</h3>
                <p class="text-xs text-zinc-400 mb-4">Market comparison against neighboring establishments in Addis Ababa.</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                  <div class="p-4 bg-[#0b0f0d] rounded-2xl border border-emerald-950">
                    <span class="text-emerald-400 uppercase font-bold block mb-1">Market Standard Average</span>
                    <p class="text-zinc-300 leading-relaxed">
                      Most neighborhood restaurants average 120 QR scans daily with an average menu viewing duration of 45 seconds and 4 registered dessert items.
                    </p>
                  </div>
                  <div class="p-4 bg-[#0b0f0d] rounded-2xl border border-emerald-950">
                    <span class="text-amber-400 uppercase font-bold block mb-1">Areas Competitors Outperform</span>
                    <p class="text-zinc-300 leading-relaxed">
                      Top regional competitors achieve higher cocktail variety scores and faster appetizer checkout speeds. Your establishment excels significantly in photography and authentic food quality ratings.
                    </p>
                  </div>
                </div>
              </div>

            </div>
          </template>

          <template x-if="activeMainTab === 'items'">
            <div class="space-y-5">

        },

        login() {
          if (this.loginPin.trim() === this.currentPassword.trim()) {
            this.currentRestaurantId = this.loginRestId;
            this.isLoggedIn = true;
            this.resetEditForm();
            this.addToast('Logged in successfully!');
          } else {
            this.addToast('Incorrect password. Use 1234');
          }
        },

        logout() {
          this.isLoggedIn = false;
          this.loginPin = '';
          this.addToast('Logged out successfully');
        },

        dashboardMetrics: {
          totalScans: '3,842',
          menuScans: '2,910',
          dailyVisitors: '148',
          weeklyVisitors: '1,036',
          avgViewingTime: '54s'
        },

        dashboardInsights: {
          bannerHighlight: "Your burger receives 52% of menu attention. Desserts are rarely viewed. Friday evenings are your busiest period."
        },

        awazeScores: {
          overall: 91,
          photography: 96,
          menuQuality: 82,
          popularity: 91,
          customerEngagement: 84,
          completeness: 100,
          menuFreshness: 78
        },

        categoryPercentages: [
          { name: 'Meat & Grills', percentage: 48 },
          { name: 'Traditional Platter', percentage: 27 },
          { name: 'Beverages & Tej', percentage: 15 },
          { name: 'Appetizers & Soups', percentage: 10 }
        ],

        get mostViewedDish() {
          return this.currentRestaurant.menuItems[0] || { name: 'Special Sizzling Tibs' };
        },

        get foodCount() {
          return this.currentRestaurant.menuItems.filter(i => i.category === 'food').length;
        },

        get drinkCount() {
          return this.currentRestaurant.menuItems.filter(i => i.category === 'drinks').length;
        },

        get avgFoodPrice() {
          const foods = this.currentRestaurant.menuItems.filter(i => i.category === 'food');
          if (foods.length === 0) return 0;
          const sum = foods.reduce((acc, i) => acc + i.price, 0);
          return (sum / foods.length).toFixed(0);
        },

        get avgDrinkPrice() {
          const drinks = this.currentRestaurant.menuItems.filter(i => i.category === 'drinks');
          if (drinks.length === 0) return 0;
          const sum = drinks.reduce((acc, i) => acc + i.price, 0);
          return (sum / drinks.length).toFixed(0);
        },

        get uniqueSubCategories() {
          return [...new Set(this.currentRestaurant.menuItems.map(i => i.subCategory))];
        },

        get filteredMenuItems() {
          return this.currentRestaurant.menuItems.filter(item => {
            if (this.itemFilterCategory !== 'all' && item.category !== this.itemFilterCategory) return false;
            if (this.itemFilterSub !== 'all' && item.subCategory !== this.itemFilterSub) return false;
            return true;
          });
        },

        notifications: [
          { id: 1, user: 'Alemayehu T.', item: 'Special Sizzling Tibs', comment: 'The spice level and aroma were phenomenal! Best tibs in Addis.', time: '10 mins ago' },
          { id: 2, user: 'Sara M.', item: 'Organic Honey Tej', comment: 'Extremely authentic and refreshing honey wine.', time: '1 hour ago' },
          { id: 3, user: 'Dawit K.', item: 'Royal Beyaynetu Platter', comment: 'Fresh injera and delicious vegan stews. Highly recommended!', time: '3 hours ago' }
        ],

        saveProfileChanges() {
          this.currentRestaurant.name = this.editForm.name;
          this.currentRestaurant.amharicName = this.editForm.amharicName;
          this.currentRestaurant.location = this.editForm.location;
          this.currentRestaurant.logo = this.editForm.logo;
          this.currentRestaurant.tagline = this.editForm.tagline;
          this.currentRestaurant.aboutDescriptionEn = this.editForm.aboutDescriptionEn;
          this.currentRestaurant.aboutDescriptionAm = this.editForm.aboutDescriptionAm;
          this.addToast('Profile updated successfully!');
        },

        updatePassword() {
          if (this.passForm.current !== this.currentPassword) {
            this.addToast('Current password is incorrect');
            return;
          }
          if (this.passForm.newPass !== this.passForm.confirm) {
            this.addToast('New passwords do not match');
            return;
          }
          this.currentPassword = this.passForm.newPass;
          this.addToast('Password changed successfully!');
          this.passForm = { current: '', newPass: '', confirm: '' };
        },

        addToast(message) {
          const id = Date.now();
          this.toasts.push({ id, message });
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
          }, 3000);
        },

        removeToast(id) {
          this.toasts = this.toasts.filter(t => t.id !== id);
        }
      };
    }
  </script>

</body>
</html>
